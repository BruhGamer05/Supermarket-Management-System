<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Requests - Customer</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <nav class="topbar" id="topbar"></nav>
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content">
    <div class="page-header">
      <div class="page-header__left">
        <div class="page-header__title">Requests</div>
        <div class="page-header__desc">Ask us to restock an existing item or request a new product we don't currently sell.</div>
      </div>
    </div>

    <div class="content-card" style="max-width:540px;">
      <div class="content-card__header"><span class="content-card__title">New request</span></div>
      <form id="requestForm" novalidate>
        <div class="form-error-banner" id="reqError"></div>

        <div class="form-group">
          <label class="form-label">Request type</label>
          <div style="display:flex; gap:20px; margin-top:4px;">
            <label style="display:flex; align-items:center; gap:6px; cursor:pointer; font-size:13px;">
              <input type="radio" name="requestType" value="existing" checked> Restock existing item
            </label>
            <label style="display:flex; align-items:center; gap:6px; cursor:pointer; font-size:13px;">
              <input type="radio" name="requestType" value="new"> Request a new product
            </label>
          </div>
        </div>

        <!-- Mode A: Select existing item from dropdown -->
        <div class="form-group" id="existingItemField">
          <label class="form-label">Choose item from store catalog <span class="required">*</span></label>
          <select id="reqItemId" class="form-control">
            <option value="">-- Choose item from store catalog --</option>
          </select>
          <span class="form-help">Select any product from our inventory to request restocking.</span>
        </div>

        <!-- Mode B: New product text box -->
        <div class="form-group" id="newItemField" style="display:none;">
          <label class="form-label">New product name <span class="required">*</span></label>
          <input type="text" id="reqItemName" class="form-control"
                 placeholder="e.g. Himalayan Pink Salt">
          <span class="form-help">Enter the product name. If it matches an item we already carry, we'll link it automatically.</span>
        </div>

        <div class="form-group">
          <label class="form-label">Quantity wanted <span class="required">*</span></label>
          <input type="number" id="reqQty" class="form-control" value="1" min="1"
                 data-validate="required,min:1">
          <span class="form-error"></span>
        </div>
        <button type="submit" class="btn btn-primary" id="reqBtn">Submit request</button>
      </form>
    </div>

    <div class="content-card">
      <div class="content-card__header"><span class="content-card__title">My previous requests</span></div>
      <div id="tableContainer"></div>
    </div>
  </main>

<script type="module">
  import { renderShell } from '../js/shell.js?v=3';
  import { requireRole } from '../js/auth.js?v=3';
  import { api } from '../js/api.js?v=3';
  import { esc } from '../js/escape.js?v=3';
  import { date } from '../js/format.js?v=3';
  import { buildTable } from '../js/table.js?v=3';
  import { validateForm, attachValidation, showFormError, clearFormError } from '../js/forms.js?v=3';
  import { toast, setLoading, badge } from '../js/ui.js?v=3';

  if (!requireRole(['Customer'])) throw new Error();
  renderShell();

  const form      = document.getElementById('requestForm');
  const container = document.getElementById('tableContainer');
  const itemSelect = document.getElementById('reqItemId');
  let tableCtrl;

  attachValidation(form);

  // Toggle between existing dropdown and new product input
  document.querySelectorAll('input[name="requestType"]').forEach(r => {
    r.addEventListener('change', e => {
      clearFormError(form);
      if (e.target.value === 'existing') {
        document.getElementById('existingItemField').style.display = 'block';
        document.getElementById('newItemField').style.display = 'none';
      } else {
        document.getElementById('existingItemField').style.display = 'none';
        document.getElementById('newItemField').style.display = 'block';
      }
    });
  });

  // Populate catalog dropdown
  async function loadCatalog() {
    try {
      const items = await api.get('/items/');
      itemSelect.innerHTML = '<option value="">-- Choose item from store catalog --</option>';
      items.forEach(it => {
        const opt = document.createElement('option');
        opt.value = it.Item_ID;
        const stock = Number(it.Total_Stock || 0);
        const stockLabel = stock === 0 ? ' [Out of stock]' : ` [Stock: ${stock}]`;
        opt.textContent = `${it.Item_Name} (${it.Category_Name || 'General'})${stockLabel}`;
        itemSelect.appendChild(opt);
      });
    } catch (err) {
      itemSelect.innerHTML = '<option value="">Failed to load catalog</option>';
    }
  }

  async function loadRequests() {
    container.innerHTML = '<div class="state-block"><span class="spinner"></span></div>';
    try {
      const requests = await api.get('/customers/me/stock-requests');
      tableCtrl = buildTable(container, requests, [
        { key: 'Request_Date',      label: 'Date', render: r => esc(date(r.Request_Date)) },
        { key: 'Item_Name',         label: 'Item', render: r => esc(r.Item_Name || r.Requested_Item_Name || '—') },
        { key: 'Quantity_Requested',label: 'Qty', numeric: true },
        { key: 'Status',            label: 'Status', render: r => badge(r.Status) },
        { key: 'Remarks',           label: 'Remarks from store', render: r => esc(r.Remarks || '—') },
      ], { emptyMsg: 'You have no previous requests.' });
    } catch (err) {
      container.innerHTML = `<div class="state-block"><div class="state-block__title text-danger">Failed to load</div></div>`;
    }
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    clearFormError(form);

    const isExisting = document.querySelector('input[name="requestType"]:checked').value === 'existing';
    const qty = parseInt(document.getElementById('reqQty').value) || 1;
    if (qty < 1) {
      showFormError(form, 'Quantity must be at least 1.');
      return;
    }

    const payload = { quantity_requested: qty };

    if (isExisting) {
      const selectedId = itemSelect.value;
      if (!selectedId) {
        showFormError(form, 'Please select an item from the catalog dropdown.');
        return;
      }
      payload.item_id = parseInt(selectedId);
    } else {
      const name = document.getElementById('reqItemName').value.trim();
      if (!name) {
        showFormError(form, 'Please enter the product name.');
        return;
      }
      payload.requested_item_name = name;
    }

    const btn     = document.getElementById('reqBtn');
    const restore = setLoading(btn, 'Submitting...');

    try {
      await api.post('/customers/me/stock-requests', payload);
      toast('Request submitted successfully.', 'success');
      form.reset();
      document.querySelector('input[name="requestType"][value="existing"]').checked = true;
      document.getElementById('existingItemField').style.display = 'block';
      document.getElementById('newItemField').style.display = 'none';
      loadRequests();
    } catch (err) {
      showFormError(form, err.message);
    } finally {
      restore();
    }
  });

  loadCatalog();
  loadRequests();
</script>
</body>
</html>
