<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - Staff</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <nav class="topbar" id="topbar"></nav>
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content">
    <div class="page-header">
      <div class="page-header__left">
        <div class="page-header__title">Staff home</div>
        <div class="page-header__desc">Your activity summary for today.</div>
      </div>
      <a href="/app/staff/pos.html" class="btn btn-primary">New bill</a>
    </div>

    <div class="kpi-strip" id="kpiStrip">
      <div class="kpi-card"><div class="kpi-card__label">Bills today</div><div class="kpi-card__value" id="kpiBills"><span class="spinner"></span></div></div>
      <div class="kpi-card"><div class="kpi-card__label">Sales today</div><div class="kpi-card__value" id="kpiSales"><span class="spinner"></span></div></div>
    </div>

    <div class="content-card">
      <div class="content-card__header">
        <span class="content-card__title">Recent bills</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Bill no.</th>
              <th>Date &amp; time</th>
              <th>Customer</th>
              <th class="text-right">Amount payable</th>
              <th>Payment</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="billsTbody">
            <tr><td colspan="6" class="state-block"><span class="spinner"></span></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

<script type="module">
  import { renderShell } from '../js/shell.js?v=3';
  import { requireRole } from '../js/auth.js?v=3';
  import { api } from '../js/api.js?v=3';
  import { esc } from '../js/escape.js?v=3';
  import { inr, dateTime } from '../js/format.js?v=3';

  if (!requireRole(['Owner', 'Employee'])) throw new Error();
  renderShell();

  async function load() {
    try {
      const bills = await api.get('/bills/');
      // KPIs: count and sum bills from today
      const today = new Date().toDateString();
      const todayBills = bills.filter(b => new Date(b.Date_Time).toDateString() === today);
      document.getElementById('kpiBills').textContent = todayBills.length;
      const todaySales = todayBills.reduce((s, b) => s + Number(b.Amount_Payable || 0), 0);
      document.getElementById('kpiSales').textContent = inr(todaySales);

      // Table: last 10 bills
      const recent = bills.slice(0, 10);
      const tbody  = document.getElementById('billsTbody');
      if (recent.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="state-block"><div class="state-block__desc">No bills yet.</div></td></tr>`;
        return;
      }
      tbody.innerHTML = recent.map(b => `
        <tr>
          <td><strong>#${esc(b.Bill_ID)}</strong></td>
          <td>${esc(dateTime(b.Date_Time))}</td>
          <td>${esc(b.Customer_Name || 'Walk-in')}</td>
          <td class="text-right">${inr(b.Amount_Payable)}</td>
          <td>${esc(b.Payment_Method)}</td>
          <td><a href="/app/invoice.html?id=${esc(b.Bill_ID)}" class="btn btn-secondary btn-sm" target="_blank">Invoice</a></td>
        </tr>`).join('');
    } catch (err) {
      document.getElementById('kpiBills').textContent = '—';
      document.getElementById('kpiSales').textContent = '—';
    }
  }

  load();
</script>
</body>
</html>
