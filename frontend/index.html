<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - Supermarket Management System</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  </style>
</head>
<body>

  <div class="public-panel">
    <div class="public-panel__logo">Supermarket System</div>
    <div class="public-panel__subtitle">Sign in to your account</div>

    <form id="loginForm" novalidate>
      <div class="form-error-banner" id="loginError"></div>

      <div class="form-group">
        <label class="form-label" for="username">Username <span class="required">*</span></label>
        <input type="text" id="username" name="username" class="form-control"
               autocomplete="username" data-validate="required" placeholder="e.g. owner">
        <span class="form-error"></span>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password <span class="required">*</span></label>
        <input type="password" id="password" name="password" class="form-control"
               autocomplete="current-password" data-validate="required" placeholder="••••••••">
        <span class="form-error"></span>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Sign in</button>
    </form>

    <p style="margin-top: 16px; text-align: center; font-size: 13px;">
      New customer?
      <a href="signup.html">Create an account</a>
    </p>
  </div>

  <script type="module">
    import { api, ApiError } from './js/api.js?v=3';
    import { validateForm, attachValidation, showFormError, clearFormError } from './js/forms.js?v=3';
    import { setLoading } from './js/ui.js?v=3';

    const form = document.getElementById('loginForm');
    const btn  = document.getElementById('loginBtn');

    attachValidation(form);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearFormError(form);
      if (!validateForm(form)) return;

      const restore = setLoading(btn, 'Signing in...');

      try {
        const data = await api.post('/auth/login', {
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value,
        });

        localStorage.setItem('token', data.access_token);
        localStorage.setItem('role',  data.role);

        const dest = {
          Owner:    '/app/owner/dashboard.html',
          Employee: '/app/staff/pos.html',
          Customer: '/app/customer/home.html',
        }[data.role] || '/app/index.html';

        window.location.href = dest;

      } catch (err) {
        restore();
        const banner = document.getElementById('loginError');
        banner.textContent = err.message || 'Invalid username or password.';
        banner.classList.add('is-visible');
      }
    });
  </script>

</body>
</html>
