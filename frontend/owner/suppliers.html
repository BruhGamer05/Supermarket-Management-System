<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suppliers - Owner</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <nav class="topbar" id="topbar"></nav>
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content">
    <div class="page-header">
      <div class="page-header__left">
        <div class="page-header__title">Suppliers</div>
        <div class="page-header__desc">Manage supplier records.</div>
      </div>
      <button class="btn btn-primary" id="addSupplierBtn">Add supplier</button>
    </div>

    <div class="content-card">
      <div class="table-toolbar">
        <input type="search" id="searchInput" class="form-control" style="width:260px;" placeholder="Search by name or GSTIN...">
      </div>
      <div id="tableContainer"></div>
    </div>
  </main>

  <!-- Add supplier modal -->
  <div id="addOverlay" style="display:none;" class="modal-overlay">
    <div class="modal modal--lg">
      <div class="modal__header">
        <span class="modal__title" id="addTitle">Add supplier</span>
        <button class="modal__close" id="addClose">&times;</button>
      </div>
      <div class="modal__body">
        <form id="addForm" novalidate>
          <div class="form-error-banner" id="addError"></div>
          <div class="form-group">
            <label class="form-label">Supplier name <span class="required">*</span></label>
            <input type="text" id="suppName" class="form-control" data-validate="required" placeholder="e.g. Agarwal Traders">
            <span class="form-error"></span>
          </div>
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label">Mobile</label>
              <input type="tel" id="suppPhone" class="form-control" data-validate="phone" maxlength="10">
              <span class="form-error"></span>
            </div>
            <div class="form-group">
              <label class="form-label">GSTIN</label>
              <input type="text" id="suppGstin" class="form-control" data-validate="gstin" maxlength="15" placeholder="09AAAFN7008D1ZL">
              <span class="form-error"></span>
            </div>
          </div>
          <div class="section-sep">Address</div>
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label">Shop / building no.</label>
              <input type="text" id="suppShop" class="form-control">
            </div>
            <div class="form-group">
              <label class="form-label">Street</label>
              <input type="text" id="suppStreet" class="form-control">
            </div>
            <div class="form-group">
              <label class="form-label">Area</label>
              <input type="text" id="suppArea" class="form-control">
            </div>
            <div class="form-group">
              <label class="form-label">City</label>
              <input type="text" id="suppCity" class="form-control">
            </div>
            <div class="form-group">
              <label class="form-label">State</label>
              <input type="text" id="suppState" class="form-control">
            </div>
            <div class="form-group">
              <label class="form-label">PIN code</label>
              <input type="text" id="suppPin" class="form-control" data-validate="pin" maxlength="6">
              <span class="form-error"></span>
            </div>
          </div>
        </form>
      </div>
      <div class="modal__footer">
        <button class="btn btn-secondary" id="addCancel">Cancel</button>
        <button class="btn btn-primary" id="addConfirm">Add supplier</button>
      </div>
    </div>
  </div>

<script type="module">
  import { renderShell } from '../js/shell.js?v=3';
  import { requireRole } from '../js/auth.js?v=3';
  import { api } from '../js/api.js?v=3';
  import { esc } from '../js/escape.js?v=3';
  import { buildTable } from '../js/table.js?v=3';
  import { validateForm, attachValidation, showFormError, clearFormError } from '../js/forms.js?v=3';
  import { toast, setLoading } from '../js/ui.js?v=3';

  if (!requireRole(['Owner'])) throw new Error();
  renderShell();

  let allSuppliers = [];
  let tableCtrl;
  const container = document.getElementById('tableContainer');
  const addForm   = document.getElementById('addForm');

  attachValidation(addForm);

  async function load() {
    container.innerHTML = '<div class="state-block"><span class="spinner"></span></div>';
    try {
      allSuppliers = await api.get('/owner/suppliers');
      tableCtrl = buildTable(container, allSuppliers, [
        { key: 'Supplier_ID',   label: 'ID' },
        { key: 'Supplier_Name', label: 'Name' },
        { key: 'Phone_Number',  label: 'Mobile', render: r => esc(r.Phone_Number || '—') },
        { key: 'GSTIN',         label: 'GSTIN', render: r => esc(r.GSTIN || '—') },
        { key: 'City',          label: 'City', render: r => esc(r.City || '—') },
        { key: 'State',         label: 'State', render: r => esc(r.State || '—') },
      ], { emptyMsg: 'No suppliers found.' });
    } catch (err) {
      container.innerHTML = `<div class="state-block"><div class="state-block__title text-danger">Failed to load</div></div>`;
    }
  }

  document.getElementById('searchInput').addEventListener('input', e => {
    const term = e.target.value.toLowerCase();
    const filtered = allSuppliers.filter(s =>
      s.Supplier_Name.toLowerCase().includes(term) ||
      (s.GSTIN || '').toLowerCase().includes(term)
    );
    if (tableCtrl) tableCtrl.update(filtered);
  });

  // Modal
  function openAddModal() {
    addForm.reset();
    clearFormError(addForm);
    document.getElementById('addOverlay').style.display = 'flex';
  }
  function closeAddModal() { document.getElementById('addOverlay').style.display = 'none'; }

  document.getElementById('addSupplierBtn').addEventListener('click', openAddModal);
  document.getElementById('addClose').addEventListener('click', closeAddModal);
  document.getElementById('addCancel').addEventListener('click', closeAddModal);

  document.getElementById('addConfirm').addEventListener('click', async () => {
    clearFormError(addForm);
    if (!validateForm(addForm)) return;

    const btn     = document.getElementById('addConfirm');
    const restore = setLoading(btn, 'Adding...');

    try {
      await api.post('/owner/suppliers', {
        supplier_name: document.getElementById('suppName').value.trim(),
        phone_number:  document.getElementById('suppPhone').value.trim()  || null,
        gstin:         document.getElementById('suppGstin').value.trim()  || null,
        shop_bldg_no:  document.getElementById('suppShop').value.trim()   || null,
        street:        document.getElementById('suppStreet').value.trim() || null,
        area:          document.getElementById('suppArea').value.trim()   || null,
        city:          document.getElementById('suppCity').value.trim()   || null,
        state:         document.getElementById('suppState').value.trim()  || null,
        pin_code:      document.getElementById('suppPin').value.trim()    || null,
      });
      toast('Supplier added.', 'success');
      closeAddModal();
      load();
    } catch (err) {
      showFormError(addForm, err.message);
    } finally {
      restore();
    }
  });

  load();
</script>
</body>
</html>
